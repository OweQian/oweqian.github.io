<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务编排依赖图</title>
<script src="https://cdn.jsdelivr.net/npm/@interopio/theme-auto@6"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  h1 {
    color: #fff;
    font-size: 28px;
    margin-bottom: 10px;
    text-align: center;
  }
  .subtitle {
    color: #8892b0;
    font-size: 14px;
    margin-bottom: 30px;
    text-align: center;
  }
  .controls {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .control-group {
    background: rgba(255, 255, 255, 0.1);
    padding: 15px 25px;
    border-radius: 12px;
    backdrop-filter: blur(10px);
  }
  .control-group label {
    color: #fff;
    font-size: 14px;
    display: block;
    margin-bottom: 8px;
  }
  .control-group select, .control-group input {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .control-group select {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
  }
  .control-group input[type="color"] {
    width: 60px;
    height: 40px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  canvas {
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    background: #fff;
    max-width: 100%;
  }
  .legend {
    display: flex;
    gap: 30px;
    margin-top: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    font-size: 14px;
  }
  .legend-line {
    width: 40px;
    height: 3px;
    border-radius: 2px;
  }
  .legend-line.dashed {
    background: repeating-linear-gradient(90deg, currentColor 0, currentColor 6px, transparent 6px, transparent 10px);
  }
</style>
</head>
<body>
  <h1>任务编排依赖图</h1>
  <p class="subtitle">点击节点或调整下方设置来查看效果</p>

  <div class="controls">
    <div class="control-group">
      <label>主线颜色</label>
      <input type="color" id="mainColor" value="#4CAF50">
    </div>
    <div class="control-group">
      <label>副线颜色</label>
      <input type="color" id="subColor" value="#9e9e9e">
    </div>
    <div class="control-group">
      <label>箭头大小</label>
      <input type="range" id="arrowSize" min="8" max="20" value="12" style="width: 100px;">
    </div>
    <div class="control-group">
      <label>节点圆角</label>
      <input type="range" id="cornerRadius" min="5" max="30" value="12" style="width: 100px;">
    </div>
  </div>

  <canvas id="canvas" width="900" height="550"></canvas>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-line" style="background: #4CAF50;"></div>
      <span>主线依赖</span>
    </div>
    <div class="legend-item">
      <div class="legend-line dashed" style="background: #9e9e9e;"></div>
      <span>副线依赖</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const mainColorInput = document.getElementById('mainColor');
    const subColorInput = document.getElementById('subColor');
    const arrowSizeInput = document.getElementById('arrowSize');
    const cornerRadiusInput = document.getElementById('cornerRadius');

    let mainColor = mainColorInput.value;
    let subColor = subColorInput.value;
    let arrowSize = parseInt(arrowSizeInput.value);
    let cornerRadius = parseInt(cornerRadiusInput.value);

    const nodes = [
      { id: 'explore', label: 'Explore', x: 150, y: 275, color: '#4CAF50', width: 120, height: 60 },
      { id: 'plan', label: 'Plan', x: 350, y: 120, color: '#4CAF50', width: 120, height: 60 },
      { id: 'general', label: 'General-purpose', x: 550, y: 120, color: '#4CAF50', width: 160, height: 60 },
      { id: 'task1', label: 'Task 1', x: 700, y: 280, color: '#9e9e9e', width: 100, height: 50 },
      { id: 'task2', label: 'Task 2', x: 700, y: 360, color: '#9e9e9e', width: 100, height: 50 },
      { id: 'task3', label: 'Task 3', x: 700, y: 440, color: '#9e9e9e', width: 100, height: 50 }
    ];

    const edges = [
      { from: 'explore', to: 'plan', isMain: true, dashed: false },
      { from: 'plan', to: 'general', isMain: true, dashed: false },
      { from: 'explore', to: 'task1', isMain: false, dashed: true },
      { from: 'explore', to: 'task1', isMain: true, dashed: true },
      { from: 'explore', to: 'task2', isMain: false, dashed: true },
      { from: 'explore', to: 'task2', isMain: true, dashed: true },
      { from: 'explore', to: 'task3', isMain: false, dashed: true },
      { from: 'explore', to: 'task3', isMain: true, dashed: true }
    ];

    function getNode(id) {
      return nodes.find(n => n.id === id);
    }

    function getCenter(node) {
      return { x: node.x + node.width / 2, y: node.y + node.height / 2 };
    }

    function drawRoundedRect(x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawArrowhead(x, y, angle, color, isDashed) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-arrowSize, arrowSize / 2);
      ctx.lineTo(-arrowSize, -arrowSize / 2);
      ctx.closePath();
      
      if (isDashed) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.fillStyle = color;
        ctx.fill();
      }
      ctx.restore();
    }

    function drawEdge(edge) {
      const fromNode = getNode(edge.from);
      const toNode = getNode(edge.to);
      const from = getCenter(fromNode);
      const to = getCenter(toNode);

      const color = edge.isMain ? mainColor : subColor;

      let startX, startY, endX, endY;
      let angle;

      if (edge.to === 'plan' || edge.to === 'general') {
        startX = fromNode.x + fromNode.width;
        startY = from.y;
        endX = toNode.x;
        endY = to.y;
      } else {
        startX = fromNode.x + fromNode.width;
        startY = from.y;
        endX = toNode.x;
        endY = to.y;
      }

      angle = Math.atan2(endY - startY, endX - startX);

      ctx.beginPath();
      ctx.setLineDash(edge.dashed ? [8, 6] : []);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.moveTo(startX, startY);

      const midX = (startX + endX) / 2;
      const midY = (startY + endY) / 2;
      ctx.quadraticCurveTo(midX, startY, midX, midY);
      ctx.quadraticCurveTo(midX, endY, endX, endY);
      
      ctx.stroke();
      ctx.setLineDash([]);

      drawArrowhead(endX, endY, angle, color, edge.dashed);
    }

    function drawNode(node) {
      const radius = cornerRadius;
      
      drawRoundedRect(node.x, node.y, node.width, node.height, radius);
      ctx.fillStyle = node.color + '20';
      ctx.fill();
      ctx.strokeStyle = node.color;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = node.id === 'explore' ? node.color : '#333';
      ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(node.label, node.x + node.width / 2, node.y + node.height / 2);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const bgGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      bgGradient.addColorStop(0, '#fafafa');
      bgGradient.addColorStop(1, '#f0f0f0');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      edges.forEach(edge => drawEdge(edge));
      nodes.forEach(node => drawNode(node));
    }

    function updateColors() {
      mainColor = mainColorInput.value;
      subColor = subColorInput.value;
      draw();
    }

    function updateArrowSize() {
      arrowSize = parseInt(arrowSizeInput.value);
      draw();
    }

    function updateCornerRadius() {
      cornerRadius = parseInt(cornerRadiusInput.value);
      draw();
    }

    mainColorInput.addEventListener('input', updateColors);
    subColorInput.addEventListener('input', updateColors);
    arrowSizeInput.addEventListener('input', updateArrowSize);
    cornerRadiusInput.addEventListener('input', updateCornerRadius);

    draw();
  </script>
</body>
</html>
