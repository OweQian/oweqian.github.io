<div class="site-atmosphere jellyfish-ocean" data-ocean-scene data-ocean-assets="{{ "ocean/" | relURL }}" data-ocean-moon="{{ .moon }}" data-ocean-gold="{{ .gold }}" data-ocean-silver="{{ .silver }}" data-ocean-crab="{{ .crab }}" data-ocean-whale-atlas="{{ .whale }}" data-ocean-whale-cheek="{{ .whaleCheek }}" data-ocean-whale-melon="{{ .whaleMelon }}" aria-hidden="true">
    <div class="ocean-haze"></div>
    <div class="ocean-sunbeam"></div>
    <canvas class="ocean-water" data-ocean-water></canvas>
    <canvas class="ocean-whale-life" data-ocean-whale-life></canvas>
    <canvas class="ocean-life" data-ocean-life></canvas>
    <div class="ocean-depth"></div>
    <div class="ocean-seabed-ground"><img class="ocean-sand" src="{{ .seabed }}" alt="" decoding="async" draggable="false"></div>
    <canvas class="ocean-seabed-life" data-ocean-seabed-life></canvas>
</div>
